apiVersion: apps/v1
kind: Deployment
metadata:
  name: evidence-demo
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: evidence-demo
  template:
    metadata:
      labels:
        app: evidence-demo
    spec:
      containers:
        - name: web
          image: quay.io/prometheus/node-exporter:v1.12.1-distroless
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: evidence-demo
  namespace: demo
spec:
  selector:
    app: evidence-demo
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
